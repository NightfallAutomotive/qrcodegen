<!DOCTYPE html>
<html lang="en">
<head>
<title>QR Code Generator | Nightfall Automotive</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#20242d" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/hold-button.css" />
<script src="qrcode.js"></script>
<script src="js/hold-button.js"></script>
</head>
<body>
<div class="page">
	<header class="page-header">
		<a class="brand" href="https://www.nightfallautomotive.co.uk/" aria-label="Nightfall Automotive home">
			<img class="brand-logo" src="assets/nf-logo.png" alt="" width="50" height="36" />
			<span class="brand-copy"><strong>NIGHTFALL</strong><span>AUTOMOTIVE</span></span>
		</a>
		<span class="page-tag">TOOLS <strong>QR</strong></span>
	</header>

	<main>
		<section class="panel" aria-labelledby="page-title">
			<div class="panel-header">
				<p class="eyebrow">NIGHTFALL TOOLS // QR</p>
				<h1 id="page-title">QR code <span>generator.</span></h1>
				<p class="intro">Type a link or any text, then hold the button to generate your code.</p>
			</div>

			<div class="panel-body">
				<div class="field">
					<label for="text">TEXT OR LINK</label>
					<input id="text" type="text" value="https://www.nightfallautomotive.co.uk/" />
					<small id="text-hint">Works with any text, including accents and emoji.</small>
					<button id="generate" class="generate"></button>
				</div>
				<div class="qr-card">
					<div id="qrcode"></div>
				</div>
			</div>
		</section>
	</main>

	<footer class="page-footer">
		<span>© NIGHTFALL AUTOMOTIVE</span>
		<span>ECU REMAPPING · TUNING · DIAGNOSTICS</span>
	</footer>
</div>

<script>
var qrcode = new QRCode(document.getElementById("qrcode"), {
	width : 200,
	height : 200,
	colorDark : "#2e3440",
	colorLight : "#eceff4"
});

var elText = document.getElementById("text");
var elHint = document.getElementById("text-hint");
var sHint = elHint.textContent;

function makeCode () {
	if (!elText.value) {
		elHint.textContent = "Type some text or a link first.";
		elHint.classList.add("is-error");
		elText.focus();
		return;
	}

	qrcode.makeCode(elText.value);
}

elText.addEventListener("input", function () {
	elHint.textContent = sHint;
	elHint.classList.remove("is-error");
});

new HoldButton(document.getElementById("generate"), {
	label : "Hold to generate",
	doneLabel : "Generated",
	backgroundColor : "#2e3440",
	fillColor : "#a3be8c",
	textColor : "#eceff4",
	fillTextColor : "#eceff4",
	size : "md",
	radius : 14,
	fillDirection : "right",
	holdTime : 1000,
	releaseTime : 200,
	pressScale : 0.97,
	wave : true,
	waveAmplitude : 9,
	glow : true,
	resetAfter : 1200,
	onHold : makeCode
});

makeCode();
</script>
</body>
</html>
